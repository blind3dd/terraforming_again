# GPG Agent — template for ~/.gnupg/gpg-agent.conf
# PINs: store in password manager only (never in git).
# Install wrappers: hack/install-gpg-wrappers.sh

pinentry-program ${HOME}/.local/bin/pinentry-mac-wrap
enable-ssh-support

default-cache-ttl 0
max-cache-ttl 0
default-cache-ttl-ssh 0
max-cache-ttl-ssh 0
no-allow-external-cache
